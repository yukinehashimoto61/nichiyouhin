<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日用品ストック</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#57a773">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="日用品ストック">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
* { box-sizing: border-box; }
:root {
  --ink: #2f4f3e;
  --ink2: #4c6c5b;
  --muted: #8fa89a;
  --paper: #f1f8f0;
  --card: #ffffff;
  --line: #dcecdc;
  --green: #57a773;
  --green-deep: #3f8659;
  --green-pale: #e8f4e7;
  --honey: #f7bd57;
  --honey-ink: #7d5511;
  --honey-pale: #fdf1d9;
  --coral: #ef8b76;
  --pink: #eb9ab8;
  --pink-ink: #8d3a57;
  --pink-pale: #fceef3;
  --shadow: 0 2px 10px rgba(47, 79, 62, .07);
  --font: "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", monospace;
}
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font); color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }

/* 下端の余白は、実際のタブバーの高さをJSで測って --tabh に入れる。
   決め打ちだと機種によって余りすぎたり足りなかったりするため。 */
.shell { max-width: 780px; margin: 0 auto; padding: 0 16px calc(var(--tabh, 62px) + 20px); }
.head { padding: calc(20px + env(safe-area-inset-top)) 0 12px; }
.title { font-size: 24px; font-weight: 800; letter-spacing: .03em; margin: 0; display: flex; align-items: center; gap: 8px; }
.title .leaf { width: 22px; height: 22px; flex: none; }
.counts { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.counts b { font-size: 15px; font-weight: 800; margin-left: 4px; color: var(--ink); }
.counts .hot b { color: var(--honey-ink); }
.counts .exp b { color: var(--coral); }
.counts .want b { color: var(--pink-ink); }
.counts [hidden] { display: none; }

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; gap: 2px;
  background: var(--card); border-top: 1px solid var(--line);
  padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  box-shadow: 0 -3px 14px rgba(47, 79, 62, .05);
}
.tab {
  flex: 1; background: none; border: 0; cursor: pointer; border-radius: 14px;
  padding: 8px 1px; font-size: 11px; font-weight: 700; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0;
}
.tab[aria-current="true"] { color: #fff; background: var(--green); }
.tab .lab { display: flex; align-items: center; gap: 3px; white-space: nowrap; }
.badge {
  font-size: 10px; font-weight: 800; line-height: 1; background: var(--honey);
  color: var(--honey-ink); border-radius: 999px; padding: 3px 5px;
}
.tab[aria-current="true"] .badge { background: #fff; color: var(--green-deep); }

@media (min-width: 720px) {
  .tabs { position: static; border: 0; background: none; padding: 0; gap: 7px; margin-top: 14px; box-shadow: none; }
  .tab { flex: 0 0 auto; padding: 9px 18px; background: var(--card); border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); }
  .shell { padding-bottom: 48px; }
}

.panel { padding-top: 18px; }
.lede { font-size: 13px; color: var(--ink2); line-height: 1.75; margin: 0 0 14px; }
.field { display: block; margin-bottom: 14px; }
.label { display: block; font-size: 12px; font-weight: 700; color: var(--ink2); margin-bottom: 6px; }
.input, .area, .sel {
  width: 100%; background: var(--card); border: 2px solid var(--line); border-radius: 14px;
  padding: 12px 14px; font-size: 16px;
}
.input:focus, .area:focus, .sel:focus { border-color: var(--green); outline: none; }
.area { resize: vertical; min-height: 68px; }

/* iOSの日付欄。幅がはみ出さないようにし、
   タップしたときにカレンダーが下に隠れないよう余白を確保する */
input[type="date"] {
  -webkit-appearance: none; appearance: none;
  min-width: 0; max-width: 100%; min-height: 48px; text-align: left;
}
.input, .area, .sel { scroll-margin-top: 72px; scroll-margin-bottom: calc(var(--tabh, 62px) + 24px); }

/* 開閉できる補足欄 */
.disclose {
  background: none; border: 0; cursor: pointer; padding: 8px 0; margin-bottom: 6px;
  font-size: 13px; font-weight: 700; color: var(--green-deep);
}
.disclose::before { content: "▸ "; }
.disclose[aria-expanded="true"]::before { content: "▾ "; }

/* iPhone SEのような狭い画面では、縦の間隔を詰める */
@media (max-width: 400px) {
  .head { padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: 10px; }
  .panel { padding-top: 14px; }
  .lede { margin-bottom: 12px; }
  .field { margin-bottom: 12px; }
  .chip { padding: 6px 11px; font-size: 12.5px; }
  .chips { gap: 6px; }
}
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 2px solid var(--line); background: var(--card); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 700; color: var(--ink2); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }

.btn {
  border: 0; border-radius: 999px; padding: 13px 20px; font-size: 15px; font-weight: 800;
  cursor: pointer; background: var(--green); color: #fff; box-shadow: 0 2px 0 var(--green-deep);
}
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:disabled { opacity: .38; cursor: not-allowed; box-shadow: none; }
.btn.wide { width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink2); border: 2px solid var(--line); box-shadow: none; }
.btn.warn { background: var(--honey); color: var(--honey-ink); box-shadow: 0 2px 0 #d99e33; }
.btn.pinkish { background: var(--pink); color: #fff; box-shadow: 0 2px 0 #cf7b9a; }
.btn.danger { background: var(--coral); box-shadow: 0 2px 0 #d4715c; }
.btn.sm { padding: 9px 15px; font-size: 13px; }
.toast { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--green-deep); }

.quick { background: var(--green-pale); border-radius: 18px; padding: 14px; margin-bottom: 18px; }
.quick .label { color: var(--green-deep); }
.quick-row { display: flex; gap: 8px; }
.quick-row .input { flex: 1; min-width: 0; background: #fff; border-color: #fff; }
.quick-row .sel { width: auto; flex: none; max-width: 40%; background: #fff; border-color: #fff; padding: 12px 8px; }
.quick .btn { margin-top: 10px; }
.quick-msg { font-size: 12.5px; font-weight: 700; color: var(--green-deep); margin: 10px 0 0; }

.card {
  position: relative; background: var(--card); border-radius: 18px; margin-bottom: 10px;
  overflow: hidden; box-shadow: var(--shadow);
}
.card::before { content: ""; position: absolute; left: 8px; top: 12px; bottom: 12px; width: 5px; border-radius: 999px; background: var(--line); }
.card.is-low::before { background: var(--honey); }
.card.is-want::before { background: var(--pink); }
.card.is-over::before { background: var(--coral); }
.card-main { display: flex; align-items: center; gap: 10px; padding: 14px 14px 14px 24px; }
.name { font-size: 16px; font-weight: 800; line-height: 1.4; }
.meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.memo { font-size: 12.5px; color: var(--ink2); margin-top: 4px; }
.pill {
  display: inline-block; font-size: 10.5px; font-weight: 800; line-height: 1;
  padding: 4px 8px; border-radius: 999px; margin-left: 7px; vertical-align: 2px;
}
.pill.soon { background: var(--honey-pale); color: var(--honey-ink); }
.pill.over { background: var(--coral); color: #fff; }
.pill.want { background: var(--pink-pale); color: var(--pink-ink); }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.open { background: none; border: 0; cursor: pointer; padding: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }

.detail { border-top: 2px dashed var(--line); padding: 14px 14px 16px 24px; background: #fbfefb; }
.dl { display: grid; grid-template-columns: 80px 1fr; gap: 7px 12px; font-size: 13px; margin: 0 0 12px; }
.dl dt { font-size: 11.5px; color: var(--muted); padding-top: 2px; font-weight: 700; }
.dl dd { margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; }

.empty {
  border: 2px dashed var(--line); border-radius: 18px; padding: 30px 20px; text-align: center;
  color: var(--muted); font-size: 13.5px; line-height: 1.8; background: rgba(255,255,255,.6);
}
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; }
.group { font-size: 12px; font-weight: 800; color: var(--green-deep); margin: 22px 0 9px; }
.hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.6; }

.stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.stamp span {
  width: 86px; height: 86px; border: 4px solid var(--green); color: var(--green-deep);
  border-radius: 50%; display: grid; place-items: center; font-size: 28px; font-weight: 800;
  background: rgba(255,255,255,.9); animation: stamp 460ms cubic-bezier(.2,.85,.25,1) forwards;
}
@keyframes stamp {
  0% { opacity: 0; transform: rotate(-30deg) scale(2.2); }
  55% { opacity: 1; transform: rotate(-11deg) scale(.94); }
  100% { opacity: 1; transform: rotate(-11deg) scale(1); }
}
.collapsing { animation: collapse 300ms ease forwards; }
@keyframes collapse { to { opacity: 0; max-height: 0; margin-bottom: 0; padding: 0; transform: translateX(14px); } }

.backup { margin-top: 30px; padding-top: 18px; border-top: 2px solid var(--line); }
.backup p { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0 0 10px; }

.update-bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 50; background: var(--green); color: #fff;
  display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700;
  padding: calc(11px + env(safe-area-inset-top)) 14px 11px;
}
.update-bar span { flex: 1; }
.update-bar .btn { background: #fff; color: var(--green-deep); box-shadow: none; }
.upd-close { background: none; border: 0; color: #fff; font-size: 20px; line-height: 1; padding: 4px 6px; cursor: pointer; opacity: .8; }

.sheet-bg {
  position: fixed; inset: 0; z-index: 60; background: rgba(47,79,62,.35);
  display: flex; align-items: flex-end; justify-content: center;
}
.sheet {
  background: var(--card); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px;
  padding: 22px 20px calc(22px + env(safe-area-inset-bottom));
  animation: rise 240ms cubic-bezier(.2,.9,.3,1);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
.sheet h2 { font-size: 17px; margin: 0 0 6px; font-weight: 800; }
.sheet .who { font-size: 13px; color: var(--muted); margin: 0 0 16px; }
@media (min-width: 720px) {
  .sheet-bg { align-items: center; }
  .sheet { border-radius: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
</style>
</head>
<body>
<div class="shell">
  <header class="head">
    <h1 class="title">
      <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V11" stroke="#57a773" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M12 12C12 7 8 4 4 4c0 5 3 8 8 8z" fill="#7cc48f"/><path d="M12 14c0-4 3-7 7-7 0 4-3 7-7 7z" fill="#57a773"/></svg>
      日用品ストック
    </h1>
    <div class="counts">
      <span>ぜんぶ<b id="cAll">0</b></span>
      <span class="hot">そろそろ<b id="cLow">0</b></span>
      <span class="want" id="cWantWrap" hidden>ほしいな<b id="cWant">0</b></span>
      <span class="exp" id="cExpWrap" hidden>期限<b id="cExp">0</b></span>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="panel" id="panel"></main>
</div>
<div id="modal"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
"use strict";
const KEY = "nichiyohin:items:v1";
const APP_VERSION = "2026.08.11-5";
const CATEGORIES = ["食料品","キッチン","バス・トイレ","洗濯","掃除","衛生・ケア","紙もの","その他"];
const DATED = ["食料品"];
const hasExpiry = (cat) => DATED.indexOf(cat) >= 0;
const RENAMED = { "食品": "食料品", "飲みもの": "食料品", "飲み物": "食料品" };
const TABS = [["list","一覧"],["add","登録"],["low","そろそろ"],["want","ほしいな"],["buy","買うもの"]];

let items = [];
let tab = "list";
let openId = null, editId = null, confirmId = null, askExpiryId = null;
let toast = "", quickMsg = "";
let addDraft = { name: "", category: CATEGORIES[0], place: "", memo: "", expiry: "" };
let addMore = false;   // 登録画面の「置き場所とメモ」を開いているか
let quickCat = { want: "その他", buy: "食料品" };
let query = { list: "", low: "" };
let filter = "all";

const $ = (s) => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtDate = (ts) => { if (!ts) return "未記録"; const d = new Date(ts);
  return d.getFullYear() + "." + String(d.getMonth()+1).padStart(2,"0") + "." + String(d.getDate()).padStart(2,"0"); };
const daysSince = (ts) => (ts ? Math.floor((Date.now() - ts) / 86400000) : null);

/* 賞味期限は "YYYY-MM-DD" の文字列。残り日数と近さの段階を返す */
function expiryInfo(item) {
  if (!item || !item.expiry) return null;
  const p = String(item.expiry).split("-");
  if (p.length !== 3) return null;
  const target = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(target)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((target - today) / 86400000);
  const level = days < 0 ? "over" : days <= 3 ? "soon" : days <= 7 ? "near" : "ok";
  const text = days < 0 ? Math.abs(days) + "日すぎ" : days === 0 ? "今日まで" : "あと" + days + "日";
  return { days: days, level: level, text: text, date: p[0] + "." + p[1] + "." + p[2] };
}
function expiryPill(i) {
  const e = expiryInfo(i);
  if (!e || e.level === "ok") return "";
  return '<span class="pill ' + (e.level === "over" ? "over" : "soon") + '">' +
    (e.level === "over" ? "期限すぎ" : e.text) + '</span>';
}
function wantPill(i) { return i.status === "want" ? '<span class="pill want">ほしいな</span>' : ""; }
function expiryMeta(i) { const e = expiryInfo(i); return e ? '／期限 ' + e.date + '（' + e.text + '）' : ""; }
function cardClass(i) {
  const e = expiryInfo(i);
  if (e && e.level === "over") return " is-over";
  if (i.status === "low") return " is-low";
  if (i.status === "want") return " is-want";
  return "";
}

/* ---------- 保存 ---------- */

function normalize() {
  let changed = false;
  items.forEach(i => {
    if (RENAMED[i.category]) { i.category = RENAMED[i.category]; changed = true; }
    if (CATEGORIES.indexOf(i.category) < 0) { i.category = "その他"; changed = true; }
    if (!hasExpiry(i.category) && i.expiry) { i.expiry = ""; changed = true; }
    if (!i.status) { i.status = "ok"; changed = true; }
    if (!i.prev) { i.prev = "ok"; changed = true; }
  });
  return changed;
}
function load() {
  try { const raw = localStorage.getItem(KEY); const p = raw ? JSON.parse(raw) : []; if (Array.isArray(p)) items = p; }
  catch (e) { items = []; }
  if (normalize()) save();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(items)); }
  catch (e) { alert("保存できませんでした。端末の空き容量を確認してください。"); }
}
function commit() { save(); render(); }

/* ---------- 状態の出し入れ ---------- */

const byStatus = (s) => items.filter(i => i.status === s);
const buyList = () => byStatus("low").sort((a,b) => (a.lowAt||0) - (b.lowAt||0));
const wantList = () => byStatus("want").sort((a,b) => (b.wantAt||0) - (a.wantAt||0));
const find = (id) => items.find(i => i.id === id);

function toBuy(id) {           // そろそろ／買うものリストへ
  const it = find(id); if (!it) return;
  it.prev = it.status; it.status = "low"; it.lowAt = Date.now(); commit();
}
function toWant(id) {          // ほしいなへ
  const it = find(id); if (!it) return;
  it.prev = it.status; it.status = "want"; it.wantAt = Date.now(); commit();
}
function undo(id) {            // 元の場所へ戻す
  const it = find(id); if (!it) return;
  const back = it.prev === "low" ? "ok" : (it.prev || "ok");
  it.status = back;
  if (back !== "low") it.lowAt = null;
  if (back !== "want") it.wantAt = null;
  it.prev = "ok"; commit();
}
function bought(id) {
  const it = find(id); if (!it) return;
  it.status = "ok"; it.prev = "ok"; it.lowAt = null; it.wantAt = null;
  it.lastBoughtAt = Date.now(); it.buyCount = (it.buyCount||0) + 1;
  it.expiry = "";                       // 買い直したので前の期限は当てはまらない
  if (hasExpiry(it.category)) askExpiryId = it.id;   // 新しい期限を聞く
  commit();
}
function removeItem(id) { items = items.filter(i => i.id !== id); confirmId = null; openId = null; commit(); }

/* 同じ名前があれば作り直さず、そこへ移す */
function quickAdd(rawName, cat, target) {
  const name = String(rawName || "").trim();
  if (!name) return;
  const dup = items.find(i => i.name.trim().toLowerCase() === name.toLowerCase());
  if (dup) {
    if (dup.status === target) { quickMsg = "「" + dup.name + "」はすでにここにあります"; render(); return; }
    dup.prev = dup.status;
    dup.status = target;
    if (target === "low") dup.lowAt = Date.now(); else dup.wantAt = Date.now();
    quickMsg = "登録ずみの「" + dup.name + "」を移しました";
    commit(); return;
  }
  items.unshift({ id: uid(), name: name, category: cat, place: "", memo: "", expiry: "",
    status: target, prev: "ok",
    lowAt: target === "low" ? Date.now() : null,
    wantAt: target === "want" ? Date.now() : null,
    lastBoughtAt: null, buyCount: 0 });
  quickMsg = "「" + name + "」を追加しました";
  commit();
}

/* ---------- 部品 ---------- */

function tabsHtml() {
  const n = buyList().length;
  return TABS.map(([id,label]) =>
    '<button class="tab" data-tab="' + id + '" aria-current="' + (tab === id) + '">' +
      '<span class="lab">' + label + (id === "buy" && n ? '<span class="badge">' + n + '</span>' : "") + '</span>' +
    '</button>').join("");
}
function emptyBox(title, body, btn, target) {
  return '<div class="empty"><b>' + title + '</b>' + body +
    (btn ? '<div style="margin-top:16px"><button class="btn sm" data-go="' + target + '">' + btn + '</button></div>' : "") + '</div>';
}
function chipsHtml(sel, attr) {
  return '<div class="chips">' + CATEGORIES.map(c =>
    '<button class="chip" ' + attr + '="' + esc(c) + '" aria-pressed="' + (sel === c) + '">' + esc(c) + '</button>').join("") + '</div>';
}
function selectHtml(id, sel) {
  return '<select class="sel" id="' + id + '">' + CATEGORIES.map(c =>
    '<option value="' + esc(c) + '"' + (sel === c ? " selected" : "") + '>' + esc(c) + '</option>').join("") + '</select>';
}
function quickBox(target, label, placeholder, btnLabel, btnClass) {
  const ids = target === "want" ? ["wName","wCat","wAdd"] : ["bName","bCat","bAdd"];
  return '<div class="quick"><span class="label">' + label + '</span>' +
    '<div class="quick-row">' +
      '<input class="input" id="' + ids[0] + '" placeholder="' + placeholder + '">' +
      selectHtml(ids[1], quickCat[target]) +
    '</div>' +
    '<button class="btn sm ' + btnClass + '" id="' + ids[2] + '">' + btnLabel + '</button>' +
    (quickMsg ? '<p class="quick-msg">' + esc(quickMsg) + '</p>' : "") +
    '</div>';
}

/* ---------- 登録 ---------- */

function addScreen() {
  return '<section>' +
    '<p class="lede">切らしたくないものを登録します。登録したものが管理の対象になります。</p>' +
    '<label class="field"><span class="label">品名</span>' +
      '<input class="input" id="aName" value="' + esc(addDraft.name) + '" placeholder="トイレットペーパー"></label>' +
    '<div class="field"><span class="label">カテゴリ</span>' + chipsHtml(addDraft.category, "data-acat") + '</div>' +
    (hasExpiry(addDraft.category)
      ? '<label class="field"><span class="label">賞味期限（任意）</span>' +
        '<input class="input" type="date" id="aExpiry" value="' + esc(addDraft.expiry) + '">' +

      : "") +
    '<button class="disclose" id="aMore" aria-expanded="' + addMore + '">置き場所とメモ' +
      (!addMore && (addDraft.place || addDraft.memo) ? '（入力あり）' : '') + '</button>' +
    (addMore
      ? '<label class="field"><span class="label">置き場所（任意）</span>' +
          '<input class="input" id="aPlace" value="' + esc(addDraft.place) + '" placeholder="洗面台の下"></label>' +
        '<label class="field"><span class="label">メモ（任意）</span>' +
          '<textarea class="area" id="aMemo" placeholder="いつもの銘柄、詰め替え用12個入りなど">' + esc(addDraft.memo) + '</textarea></label>'
      : "") +
    '<button class="btn wide" id="aSubmit">登録する</button>' +
    (toast ? '<p class="toast">「' + esc(toast) + '」を登録しました。つづけて登録できます。</p>' : "") +
    '</section>';
}

/* ---------- そろそろ ---------- */

function lowScreen() {
  if (!items.length) return emptyBox("まだ何もありません",
    "先に登録すると、ここでなくなりそうなものを選べます。", "登録へ", "add");
  const q = query.low.trim().toLowerCase();
  const low = buyList();
  const stock = byStatus("ok").filter(i => (i.name + i.category + (i.place||"")).toLowerCase().includes(q));

  let h = '<section><p class="lede">残りが少ないと気づいたら、ここで「そろそろ」に入れます。入れたものは買うものリストに並びます。</p>' +
    '<label class="field"><span class="label">さがす</span>' +
    '<input class="input" id="qLow" value="' + esc(query.low) + '" placeholder="品名でさがす"></label><div id="results">';

  if (low.length) {
    h += '<div class="group">そろそろ登録ずみ ' + low.length + '</div>';
    h += low.map(i => '<div class="card' + cardClass(i) + '"><div class="card-main"><div class="grow">' +
      '<div class="name">' + esc(i.name) + expiryPill(i) + '</div>' +
      '<div class="meta">' + esc(i.category) + '／' + daysSince(i.lowAt) + '日前に登録' + expiryMeta(i) + '</div></div>' +
      '<button class="btn ghost sm" data-undo="' + i.id + '">取り消す</button></div></div>').join("");
  }

  const groups = CATEGORIES.map(c => [c, stock.filter(i => i.category === c)]).filter(g => g[1].length);
  if (!groups.length) {
    h += '<div class="empty" style="margin-top:20px">見つかりませんでした。別の言葉でさがすか、新しく登録してください。</div>';
  } else {
    h += groups.map(([cat, arr]) => '<div class="group">' + esc(cat) + '</div>' + arr.map(i =>
      '<div class="card' + cardClass(i) + '"><div class="card-main"><div class="grow">' +
      '<div class="name">' + esc(i.name) + expiryPill(i) + '</div>' +
      '<div class="meta">' + (i.place ? esc(i.place) + "／" : "") + '前回 ' + fmtDate(i.lastBoughtAt) + expiryMeta(i) + '</div></div>' +
      '<button class="btn warn sm" data-tobuy="' + i.id + '">そろそろ</button></div></div>').join("")).join("");
  }
  return h + '</div></section>';
}

/* ---------- 買うもの ---------- */

/* ---------- 一覧 ---------- */

function detailHtml(i) {

    return '<div class="detail">' +
      '<label class="field"><span class="label">品名</span><input class="input" id="eName" value="' + esc(i.name) + '"></label>' +
      '<div class="field"><span class="label">カテゴリ</span>' + chipsHtml(i.category, "data-ecat") + '</div>' +
      (hasExpiry(i.category)
        ? '<label class="field"><span class="label">賞味期限（任意）</span>' +
          '<input class="input" type="date" id="eExpiry" value="' + esc(i.expiry||"") + '"></label>' : "") +
      '<label class="field"><span class="label">置き場所</span><input class="input" id="ePlace" value="' + esc(i.place||"") + '"></label>' +
      '<label class="field"><span class="label">メモ</span><textarea class="area" id="eMemo">' + esc(i.memo||"") + '</textarea></label>' +
      '<div class="row"><button class="btn sm" data-savee="' + i.id + '">保存する</button>' +

    '<dt>置き場所</dt><dd>' + (i.place ? esc(i.place) : "未設定") + '</dd>' +
    '<dt>メモ</dt><dd>' + (i.memo ? esc(i.memo) : "なし") + '</dd>' +

    (i.status === "ok" ? '<button class="btn ghost sm" data-towant="' + i.id + '">ほしいなに入れる</button>' : "") +
    (i.status !== "ok" ? '<button class="btn ghost sm" data-undo="' + i.id + '">元にもどす</button>' : "") +
    (confirmId === i.id
      ? '<button class="btn danger sm" data-del="' + i.id + '">削除する</button><button class="btn ghost sm" data-nodel="1">やめる</button>'
      : '<button class="btn ghost sm" data-confirm="' + i.id + '">管理から外す</button>') +

function footerHtml() {
  return '<div class="backup">' +
    '<p>データはこの端末の中だけに保存されています。念のため、ときどき書き出しておくと安心です。</p>' +
    '<div class="row"><button class="btn ghost sm" id="expBtn"' + (items.length ? "" : " disabled") + '>書き出す</button>' +
    '<button class="btn ghost sm" id="impBtn">読み込む</button></div>' +
    '<p class="hint" style="margin-top:16px">バージョン ' + APP_VERSION +
    '　／ 最新版が反映されないときは「更新を確認」を押してください。登録した品物のデータは消えません。</p>' +
    '<div class="row"><button class="btn ghost sm" id="updBtn">更新を確認</button></div></div>';
}

function listScreen() {
  if (!items.length) return '<section>' +
    emptyBox("まだ何もありません", "よく使うものを登録すると、ここに並びます。", "登録へ", "add") +
    footerHtml() + '</section>';

  const q = query.list.trim().toLowerCase();
  const rank = (i) => {
    const e = expiryInfo(i);
    if (e && e.level === "over") return 0;
    if (e && (e.level === "soon" || e.level === "near")) return 1;
    if (i.status === "low") return 2;
    if (i.status === "want") return 3;
    return 4;
  };
  const shown = items
    .filter(i => {
      if (filter === "low") return i.status === "low";
      if (filter === "want") return i.status === "want";
      if (filter === "ok") return i.status === "ok";
      if (filter === "exp") { const e = expiryInfo(i); return !!e && e.level !== "ok"; }
      return true;
    })
    .filter(i => (i.name + i.category + (i.place||"") + (i.memo||"")).toLowerCase().includes(q))
    .sort((a,b) => {
      const r = rank(a) - rank(b);
      if (r) return r;
      const ea = expiryInfo(a), eb = expiryInfo(b);
      if (ea && eb) return ea.days - eb.days;
      return a.category.localeCompare(b.category, "ja");
    });

  let h = '<section><label class="field"><span class="label">さがす</span>' +
    '<input class="input" id="qList" value="' + esc(query.list) + '" placeholder="品名・置き場所でさがす"></label>' +
    '<div class="chips" style="margin-bottom:16px">' +
    [["all","ぜんぶ"],["low","そろそろ"],["want","ほしいな"],["exp","期限間近"],["ok","在庫あり"]].map(([v,l]) =>
      '<button class="chip" data-filter="' + v + '" aria-pressed="' + (filter === v) + '">' + l + '</button>').join("") +
    '</div><div id="results">';

  if (!shown.length) {
    h += '<div class="empty">見つかりませんでした。別の言葉でさがしてください。</div>';
  } else {
    h += shown.map(i => {
      const isOpen = openId === i.id;
      let action;
      if (i.status === "low") action = '<button class="btn sm" data-buy="' + i.id + '">買ったよ</button>';
      else if (i.status === "want") action = '<button class="btn sm" data-tobuy="' + i.id + '">買う！</button>';
      else action = '<button class="btn warn sm" data-tobuy="' + i.id + '">そろそろ</button>';
      return '<div class="card' + cardClass(i) + '"><div class="card-main"><div class="grow">' +
        '<div class="name">' + esc(i.name) + wantPill(i) + expiryPill(i) + '</div>' +
        '<div class="meta">' + esc(i.category) +
          (i.status === "low" ? '／そろそろ（' + daysSince(i.lowAt) + '日前）'
           : i.status === "want" ? '／ほしいな'
           : '／前回 ' + fmtDate(i.lastBoughtAt)) + expiryMeta(i) + '</div></div>' +
        action +
        '<button class="open" data-open="' + i.id + '" aria-expanded="' + isOpen + '">' + (isOpen ? "閉じる" : "詳細") + '</button>' +
        '</div>' + (isOpen ? detailHtml(i) : "") + '</div>';
    }).join("");
  }
  return h + '</div>' + footerHtml() + '</section>';
}

/* ---------- 賞味期限をたずねるシート ---------- */

function modalHtml() {
  const it = find(askExpiryId);
  if (!it) return "";
  return '<div class="sheet-bg" id="sheetBg"><div class="sheet" role="dialog" aria-modal="true">' +
    '<h2>新しい賞味期限を入れますか？</h2>' +
    '<p class="who">' + esc(it.name) + ' を買いました</p>' +
    '<input class="input" type="date" id="mExpiry" value="">' +
    '<div class="row" style="margin-top:16px">' +
    '<button class="btn" id="mSave">登録する</button>' +
    '<button class="btn ghost" id="mSkip">今は登録しない</button>' +
    '</div></div></div>';
}

/* ---------- 描画 ---------- */

function render() {
  $("#cAll").textContent = items.length;
  $("#cLow").textContent = buyList().length;
  const nWant = wantList().length;
  $("#cWant").textContent = nWant;
  $("#cWantWrap").hidden = nWant === 0;
  const nExp = items.filter(i => { const e = expiryInfo(i); return e && e.level !== "ok"; }).length;
  $("#cExp").textContent = nExp;
  $("#cExpWrap").hidden = nExp === 0;
  $("#tabs").innerHTML = tabsHtml();
  $("#panel").innerHTML =
    tab === "add" ? addScreen() :
    tab === "low" ? lowScreen() :
    tab === "want" ? wantScreen() :
    tab === "buy" ? buyScreen() : listScreen();
  $("#modal").innerHTML = askExpiryId ? modalHtml() : "";
  const mx = $("#mExpiry"); if (mx) mx.focus();
}

/* ---------- 操作 ---------- */

function goTab(id) { tab = id; toast = ""; quickMsg = ""; openId = null; editId = null; confirmId = null; render(); }

/* 画面に出ている入力だけを下書きへ写す。畳まれている欄は前の値のまま残す */
function readAddForm() {
  const n = $("#aName");   if (n) addDraft.name = n.value;
  const p = $("#aPlace");  if (p) addDraft.place = p.value;
  const m = $("#aMemo");   if (m) addDraft.memo = m.value;
  const e = $("#aExpiry"); if (e) addDraft.expiry = e.value;
}

function submitAdd() {
  readAddForm();
  const name = addDraft.name.trim();
  if (!name) return;
  items.unshift({ id: uid(), name: name, category: addDraft.category,
    place: addDraft.place.trim(), memo: addDraft.memo.trim(),
    expiry: hasExpiry(addDraft.category) ? addDraft.expiry : "",
    status: "ok", prev: "ok", lowAt: null, wantAt: null, lastBoughtAt: null, buyCount: 0 });
  toast = name;
  addDraft = { name: "", category: addDraft.category, place: "", memo: "", expiry: "" };
  save(); render();
  const el = $("#aName"); if (el) el.focus();
}

function saveEdit(id) {
  const it = find(id); if (!it) return;
  const n = $("#eName").value.trim(); if (!n) return;
  it.name = n; it.place = $("#ePlace").value.trim(); it.memo = $("#eMemo").value.trim();
  const exp = $("#eExpiry");
  it.expiry = hasExpiry(it.category) && exp ? exp.value : "";
  editId = null; commit();
}

function exportData() {
  const blob = new Blob([JSON.stringify(items, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "nichiyohin-" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const p = JSON.parse(r.result);
      if (!Array.isArray(p)) throw new Error("bad");
      if (items.length && !confirm("読み込むと今の登録内容は置き換わります。続けますか？")) return;
      items = p; normalize(); commit();
    } catch (e) { alert("読み込めませんでした。書き出したJSONファイルを選んでください。"); }
  };
  r.readAsText(file);
}

document.addEventListener("click", (e) => {
  const t = e.target.closest("button");
  if (!t) {
    if (e.target.id === "sheetBg") { askExpiryId = null; render(); }
    return;
  }
  const d = t.dataset;
  if (d.tab) return goTab(d.tab);
  if (d.go) return goTab(d.go);

  if (d.acat) {
    readAddForm();
    addDraft.category = d.acat;
    if (!hasExpiry(d.acat)) addDraft.expiry = "";
    return render();
  }
  if (t.id === "aMore") { readAddForm(); addMore = !addMore; return render(); }
  if (d.ecat) {
    const it = find(editId);
    if (it) {
      const n = $("#eName"); if (n && n.value.trim()) it.name = n.value.trim();
      const p = $("#ePlace"); if (p) it.place = p.value.trim();
      const m = $("#eMemo"); if (m) it.memo = m.value.trim();
      const ex = $("#eExpiry"); if (ex) it.expiry = ex.value;
      it.category = d.ecat;
      if (!hasExpiry(d.ecat)) it.expiry = "";
      save(); render();
    }
    return;
  }
  if (t.id === "aSubmit") return submitAdd();
  if (t.id === "wAdd") { quickCat.want = $("#wCat").value; return quickAdd($("#wName").value, quickCat.want, "want"); }
  if (t.id === "bAdd") { quickCat.buy = $("#bCat").value; return quickAdd($("#bName").value, quickCat.buy, "low"); }

  if (d.tobuy) return toBuy(d.tobuy);
  if (d.towant) return toWant(d.towant);
  if (d.undo) return undo(d.undo);
  if (d.buy) {
    const card = document.querySelector('[data-card="' + d.buy + '"]');
    if (card) {
      card.insertAdjacentHTML("beforeend", '<div class="stamp"><span>済</span></div>');
      card.classList.add("collapsing");
      setTimeout(() => bought(d.buy), 700);
    } else { bought(d.buy); }
    return;
  }
  if (d.open) { openId = openId === d.open ? null : d.open; editId = null; confirmId = null; return render(); }
  if (d.edit) { editId = d.edit; return render(); }
  if (d.savee) return saveEdit(d.savee);
  if (d.cancele) { editId = null; return render(); }
  if (d.confirm) { confirmId = d.confirm; return render(); }
  if (d.nodel) { confirmId = null; return render(); }
  if (d.del) return removeItem(d.del);
  if (d.filter) { filter = d.filter; return render(); }

  if (t.id === "mSave") {
    const it = find(askExpiryId); const v = $("#mExpiry").value;
    if (it && v) it.expiry = v;
    askExpiryId = null; return commit();
  }
  if (t.id === "mSkip") { askExpiryId = null; return render(); }

  if (t.id === "expBtn") return exportData();
  if (t.id === "impBtn") return $("#importFile").click();
  if (t.id === "updBtn") return applyUpdate();
});

document.addEventListener("input", (e) => {
  if (e.target.id === "qList") { query.list = e.target.value; $("#results").outerHTML = partial(listScreen); }
  if (e.target.id === "qLow") { query.low = e.target.value; $("#results").outerHTML = partial(lowScreen); }
});
function partial(fn) { const w = document.createElement("div"); w.innerHTML = fn(); return w.querySelector("#results").outerHTML; }

document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "aName") { e.preventDefault(); submitAdd(); }
  if (e.target.id === "wName") { e.preventDefault(); quickCat.want = $("#wCat").value; quickAdd(e.target.value, quickCat.want, "want"); }
  if (e.target.id === "bName") { e.preventDefault(); quickCat.buy = $("#bCat").value; quickAdd(e.target.value, quickCat.buy, "low"); }
  if (e.target.id === "mExpiry") { e.preventDefault(); const it = find(askExpiryId);
    if (it && e.target.value) it.expiry = e.target.value; askExpiryId = null; commit(); }
});

$("#importFile").addEventListener("change", (e) => {
  if (e.target.files && e.target.files[0]) importData(e.target.files[0]);
  e.target.value = "";
});

/* ---------- 画面の高さまわり ---------- */

/* 下端に固定されたタブバーの実際の高さを測って余白に反映する。
   固定されていない広い画面では余白を足さない。 */
function syncTabHeight() {
  const bar = $("#tabs");
  if (!bar) return;
  const fixed = getComputedStyle(bar).position === "fixed";
  document.documentElement.style.setProperty("--tabh", fixed ? bar.offsetHeight + "px" : "0px");
}
window.addEventListener("resize", syncTabHeight);
window.addEventListener("orientationchange", () => setTimeout(syncTabHeight, 200));

/* 日付欄はタップするとカレンダーが下に開く。画面下寄りだと隠れるので、
   いったん中央付近まで送ってから開かせる。 */
document.addEventListener("focusin", (e) => {
  const el = e.target;
  if (!el || el.type !== "date") return;
  setTimeout(() => {
    try { el.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (err) { el.scrollIntoView(); }
  }, 120);
});

load();
render();
syncTabHeight();

/* ---------- 更新まわり ----------
   キャッシュ（アプリ本体の控え）と localStorage（登録した品物）は別の入れもの。
   ここで消すのはキャッシュだけなので、登録データは残る。 */

async function applyUpdate() {
  const btn = $("#updBtn");
  if (btn) { btn.disabled = true; btn.textContent = "確認中…"; }
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* 失敗しても下の再読み込みで取り直せる */ }
  location.reload();
}

function showUpdateBar() {
  if (document.getElementById("updBar")) return;
  const bar = document.createElement("div");
  bar.className = "update-bar";
  bar.id = "updBar";
  bar.innerHTML = '<span>新しいバージョンがあります</span>' +
    '<button class="btn sm" id="updNow">読み込み直す</button>' +
    '<button class="upd-close" id="updLater" aria-label="あとで">×</button>';
  document.body.appendChild(bar);
  document.getElementById("updNow").addEventListener("click", () => location.reload());
  document.getElementById("updLater").addEventListener("click", () => bar.remove());
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then((reg) => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener("statechange", () => {
          if (w.state === "installed" && navigator.serviceWorker.controller) showUpdateBar();
        });
      });
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
